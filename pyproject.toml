[project]
name = "alvo-forecast"
version = "0.1.0"
description = "Ferramentas para forecast imobiliário com análise SPIN"
authors = [{name = "Equipe Alvo"}]
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
app = [
    "pandas>=2.0",
    "streamlit>=1.32",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
